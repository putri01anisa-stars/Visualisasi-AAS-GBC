<!DOCTYPE html>
<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analisis Gangguan Ca pada AAS</title>
<style>
:root{--bg:#0d1b24;--bg2:#17303c;--pn:#10222cee;--tx:#e8f1f2;--mu:#8fa9b3;--ac:#ffb347;--ln:#2b4857;--ok:#6fd6b0;--bad:#ff7a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#dfeaed;--bg2:#f3f8f9;--pn:#fbfdfdee;--tx:#12303b;--mu:#4d6b76;--ac:#b85f00;--ln:#b9ced5;--ok:#0f8a64;--bad:#c2392b}}
:root[data-theme="light"]{--bg:#dfeaed;--bg2:#f3f8f9;--pn:#fbfdfdee;--tx:#12303b;--mu:#4d6b76;--ac:#b85f00;--ln:#b9ced5;--ok:#0f8a64;--bad:#c2392b}
:root[data-theme="dark"]{--bg:#0d1b24;--bg2:#17303c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%;background:radial-gradient(ellipse at 40% 35%,var(--bg2),var(--bg) 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
h1{margin:0;font:700 20px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.2px}
#top{position:absolute;left:14px;top:12px;max-width:46%;pointer-events:none}
#top p{margin:3px 0 0;color:var(--mu);font-size:12.5px}
#panel{position:absolute;right:12px;top:12px;bottom:12px;width:340px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;overflow:auto;backdrop-filter:blur(6px)}
#panel h2{margin:0 0 4px;font:700 18px Georgia,serif;color:var(--ac)}
#panel h3{margin:12px 0 4px;font-size:13px;color:var(--mu);font-weight:600}
#panel p{margin:0 0 6px;font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:12.5px;color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:#10202a;border-color:var(--ac);font-weight:700}
#tools{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 380px)}
#tip{position:absolute;pointer-events:none;background:var(--pn);border:1px solid var(--ln);padding:3px 8px;border-radius:6px;font-size:12px;display:none}
.bar{height:16px;background:var(--ln);border-radius:4px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .5s,background .3s}
.eq{font-family:Consolas,monospace;font-size:12.5px;background:#0003;border-radius:6px;padding:6px 8px;margin:4px 0}
.kv{display:flex;justify-content:space-between;font-size:13px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.tabs{margin-bottom:10px}
input[type=range]{width:100%;accent-color:var(--ac)}
#cal{width:100%;height:auto;border:1px solid var(--ln);border-radius:8px;touch-action:none;cursor:crosshair;margin-bottom:6px}
#exw{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu)}#exw input{width:100px}
@media (max-width:760px){
#panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:44%}
#top{max-width:80%}h1{font-size:17px}
#tools{bottom:calc(44% + 14px);max-width:calc(100% - 28px)}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
<div id="top"><h1>Analisis Gangguan Ca pada AAS</h1><p>Instrumen GBC SavantAA (Flame AAS, λ 422,7 nm). Putar, zoom, lalu sentuh bagian alat.</p></div>
<div id="tools">
<button id="bBeam" class="on">Jalur cahaya</button>
<button id="bCase" class="on">Casing tembus pandang</button>
<button id="bExp">Bongkar komponen</button><label id="exw">Jarak <input id="ex" type="range" min="0" max="1" step="0.01" value="0" aria-label="Jarak bongkar"></label>
<button id="bSpin">Putar otomatis</button>
<button id="bIn">Zoom +</button><button id="bOut">Zoom −</button><button id="bReset">Reset</button>
</div>
<div id="panel" aria-live="polite"></div>
<div id="tip"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- DATA ----------
const INFO={
lamp:{n:"Lampu Katoda Berongga (HCL)",f:[-3,1.3,0,3.2],
d:"Sumber cahaya. Katodanya berisi logam Ca, sehingga memancarkan garis spektrum khas Ca pada 422,7 nm.",
c:"Hanya atom Ca yang menyerap garis ini, jadi analisis selektif. Gangguan di sini bukan spektral, melainkan kimia: atom Ca bebas di nyala berkurang."},
flame:{n:"Nyala Udara-Asetilena (~2300 °C)",f:[-1.2,1.3,0,3],
d:"Mengubah larutan yang dikabutkan menjadi atom netral: desolvasi, penguapan, disosiasi, lalu atomisasi (Ca²⁺ → Ca⁰).",
c:"Inti masalah gangguan. Suhu ini tidak cukup memecah Ca₂P₂O₇ (kalsium pirofosfat) dan sebagian CaSO₄, sehingga populasi Ca⁰ turun dan serapan mengecil."},
burner:{n:"Kepala Pembakar (Burner)",f:[-1.2,0.9,0,2.8],
d:"Celah panjang (slot) yang menghasilkan nyala lebar sehingga lintasan cahaya melewati banyak atom.",
c:"Campuran bahan bakar dan oksidator bertemu di sini. Rasio gas menentukan suhu nyala, dan suhu menentukan seberapa besar gangguan refraktori."},
nebulizer:{n:"Nebulizer & Ruang Semprot",f:[-1.2,0.5,0.4,2.8],
d:"Menyedot sampel, mengubahnya jadi kabut halus, dan memilih tetes kecil untuk masuk ke nyala. Sisanya mengalir ke drain.",
c:"Larutan uji berisi Ca, SO₄²⁻, PO₄³⁻, serta Sr²⁺/La³⁺/EDTA dikabutkan bersama. Laju aspirasi yang tidak stabil ikut menurunkan r kurva kalibrasi (0,9923)."},
mono:{n:"Monokromator",f:[0.6,1.3,0,3],
d:"Memilih panjang gelombang 422,7 nm dan membuang cahaya lain, termasuk emisi nyala.",
c:"Memastikan sinyal berasal dari Ca. Dengan slit yang sesuai, gangguan spektral dapat diabaikan, sehingga penurunan serapan pada praktikum berasal dari kimia."},
det:{n:"Detektor (Tabung Pengganda Foton)",f:[1.9,1.3,0,2.8],
d:"Mengubah intensitas cahaya yang lolos dari nyala menjadi sinyal listrik. Absorbansi A = −log(I/I₀).",
c:"Membaca penurunan cahaya akibat atom Ca⁰. Ca tanpa pengganggu: A = 0,027; dengan fosfat: A ≈ 0,002."},
pc:{n:"Komputer & Perangkat Lunak",f:[-5,1.1,0.8,3],
d:"Mengatur parameter, menampilkan absorbansi, dan menghitung konsentrasi dari kurva kalibrasi.",
c:"Kurva standar: y = 0,0128x + 0,0054. Konsentrasi uji = (A − 0,0054) / 0,0128. Nilai negatif pada larutan 6–9 menandakan Ca hampir tidak terdeteksi."},
acet:{n:"Tabung Asetilena (bahan bakar)",f:[3.7,1.1,-0.8,4],
d:"Bahan bakar nyala. Selalu tegak, dengan regulator dan selang tahan api.",
c:"Asetilena dengan udara menghasilkan nyala sekitar 2300 °C. Nyala N₂O-asetilena lebih panas dan bisa dipakai untuk mengurangi gangguan refraktori."},
air:{n:"Suplai Udara (oksidator)",f:[4.4,1.0,-0.2,4],
d:"Menyediakan udara bertekanan sebagai oksidator dan sebagai gas penyedot sampel di nebulizer.",
c:"Laju udara memengaruhi kecepatan aspirasi dan suhu nyala, dua hal yang menjaga kestabilan serapan."},
sample:{n:"Wadah Sampel / Larutan Uji",f:[-1.7,0.4,1.7,2.8],
d:"Tempat larutan standar dan larutan uji. Selang kapiler menyalurkannya ke nebulizer.",
c:"Berisi 10 larutan uji: Ca 2 mg/L dengan SO₄²⁻ atau PO₄³⁻ 100 mg/L, ditambah releasing agent (Sr²⁺, La³⁺) atau masking agent (EDTA)."},
drain:{n:"Wadah Pembuangan (Drain)",f:[-2.6,0.3,1.7,2.8],
d:"Menampung kelebihan larutan dari ruang semprot. Selang drain harus berbentuk U agar gas tidak bocor.",
c:"Sisa larutan yang tidak diatomisasi terbuang di sini. Pembilasan kurang sempurna menimbulkan efek memori antar larutan."},
duct:{n:"Ducting / Cerobong Buangan",f:[-1.2,2.8,0,4],
d:"Menyedot gas panas dan uap hasil pembakaran keluar ruangan.",
c:"Menjaga keselamatan operator dan kestabilan nyala dari aliran udara sekitar."}
};
const BASE=0.027;
const SC=[
{l:"Ca",a:.027,c:1.6875,t:"Pembanding",e:"Ca²⁺ → Ca⁰ (nyala)",x:"Ca 2 mg/L tanpa pengganggu. Ini acuan serapan."},
{l:"+SO₄²⁻",a:.021,c:1.2188,t:"Gangguan sulfat",e:"Ca²⁺ + SO₄²⁻ → CaSO₄",x:"CaSO₄ cukup tahan panas dan menghambat atomisasi. Serapan turun sekitar 22%."},
{l:"+SO₄+Sr",a:.038,c:2.5469,t:"Releasing agent Sr²⁺",e:"CaSO₄ + Sr²⁺ → Ca²⁺ + SrSO₄",x:"Sr²⁺ lebih suka mengikat sulfat, sehingga Ca²⁺ bebas. Serapan naik ke 0,038."},
{l:"+SO₄+La",a:.038,c:2.5469,t:"Releasing agent La³⁺",e:"3CaSO₄ + 2La³⁺ → 3Ca²⁺ + La₂(SO₄)₃",x:"La³⁺ mengikat sulfat dengan cara yang sama. Serapan 0,038."},
{l:"+SO₄+EDTA",a:.022,c:1.2969,t:"Masking agent EDTA",e:"Ca²⁺ + EDTA⁴⁻ → [Ca-EDTA]²⁻",x:"EDTA mengomplekskan Ca, yang terurai di nyala. Pemulihan terbatas (A 0,022)."},
{l:"+PO₄³⁻",a:.002,c:-.2656,t:"Gangguan fosfat",e:"2Ca²⁺ + P₂O₇⁴⁻ → Ca₂P₂O₇",x:"Kalsium pirofosfat sangat tahan panas. Nyala udara-asetilena tidak sanggup memecahnya."},
{l:"+PO₄+Sr",a:.001,c:-.3436,t:"Fosfat + Sr²⁺",e:"Sr²⁺ 100 mg/L belum cukup",x:"Rasio Sr terhadap fosfat 1:1 (mg/L) tidak mencukupi. Perlu konsentrasi pelepas jauh lebih tinggi."},
{l:"+PO₄+La",a:.005,c:-.0312,t:"Fosfat + La³⁺",e:"La³⁺ 100 mg/L belum cukup",x:"Sedikit membaik, tetapi masih jauh di bawah acuan. Butuh La berlebih (0,5–1%)."},
{l:"+PO₄+EDTA",a:.005,c:-.0312,t:"Fosfat + EDTA",e:"EDTA 100 mg/L belum cukup",x:"Perlindungan EDTA tidak memadai pada fosfat setinggi ini."}
];
let cur=0,showBeam=true;

// ---------- SCENE ----------
const app=document.getElementById('app');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));app.insertBefore(R.domElement,app.firstChild);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(42,1,.1,100);
C.position.set(5.5,3.6,8);
const O=new THREE.OrbitControls(C,R.domElement);O.enableDamping=true;O.minDistance=1.5;O.maxDistance=20;O.target.set(-.5,1.2,0);O.maxPolarAngle=Math.PI*.52;
S.add(new THREE.HemisphereLight(0xffffff,0x334455,.9));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,8,6);S.add(dl);
const fl=new THREE.PointLight(0xff9a3c,1.2,6);fl.position.set(-1.2,1.4,0);S.add(fl);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.2,roughness:.55},o));
const mk=(g,m,x=0,y=0,z=0)=>{const q=new THREE.Mesh(g,m);q.position.set(x,y,z);return q};
const pick=[];
function grp(key,...ms){const g=new THREE.Group();ms.forEach(m=>g.add(m));g.userData.key=key;pick.push(g);S.add(g);return g}
const cyl=(r,h,m,x,y,z,ax)=>{const q=mk(new THREE.CylinderGeometry(r,r,h,28),m,x,y,z);if(ax==='x')q.rotation.z=Math.PI/2;if(ax==='z')q.rotation.x=Math.PI/2;return q};
const tube=(pts,c,r=.035)=>mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))),24,r,6),M(c));

// meja
S.add(mk(new THREE.BoxGeometry(14,.2,6),M(0x20343f,{roughness:.9}),-.3,-.1,0));
// casing
const caseMat=M(0xf2f5f6,{transparent:true,opacity:.16,depthWrite:false,roughness:.3});
const casing=mk(new THREE.BoxGeometry(6.4,1.9,2.4),caseMat,-.5,1.15,0);S.add(casing);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(casing.geometry),new THREE.LineBasicMaterial({color:0x9fc2cf}));casing.add(edges);
S.add(mk(new THREE.BoxGeometry(6.4,.2,2.5),M(0x3a3f45),-.5,.1,0));
const cv=document.createElement('canvas');cv.width=512;cv.height=96;const cx=cv.getContext('2d');
cx.fillStyle='#ffb347';cx.font='bold 54px Georgia';cx.fillText('GBC',10,62);cx.fillStyle='#e8f1f2';cx.font='36px sans-serif';cx.fillText('SavantAA',170,60);
const lg=mk(new THREE.PlaneGeometry(2.4,.45),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true}),-2.4,.55,1.22);S.add(lg);

// lampu katoda
grp('lamp',cyl(.42,.5,M(0x55636b,{metalness:.7}),-3,1.3,0,'x'),cyl(.2,.7,M(0xffb347,{emissive:0x7a3d00}),-2.55,1.3,0,'x'),cyl(.3,.15,M(0x222c33),-3.35,1.3,0,'x'));
// kompartemen sampel (kotak gelap transparan)
S.add(mk(new THREE.BoxGeometry(1.5,1.4,1.6),M(0x14212a,{transparent:true,opacity:.35,depthWrite:false}),-1.2,1.0,0));
// burner
grp('burner',mk(new THREE.BoxGeometry(1,.14,.14),M(0xb7c0c6,{metalness:.8}),-1.2,1.1,0),mk(new THREE.BoxGeometry(.9,.4,.3),M(0x8a949b,{metalness:.7}),-1.2,.88,0));
// nebulizer + ruang semprot
grp('nebulizer',cyl(.22,.5,M(0x6d7b83,{metalness:.6}),-1.2,.5,0),cyl(.08,.5,M(0x3b7fa0),-1.2,.4,.4,'z'));
// nyala
const flameM=mk(new THREE.ConeGeometry(.2,.55,20,1,true),new THREE.MeshBasicMaterial({color:0xff8a2a,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false}),-1.2,1.43,0);
const flameC=mk(new THREE.ConeGeometry(.1,.4,16,1,true),new THREE.MeshBasicMaterial({color:0x5aa8ff,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false}),-1.2,1.33,0);
const flameHit=mk(new THREE.CylinderGeometry(.35,.35,.8,8),new THREE.MeshBasicMaterial({visible:false}),-1.2,1.4,0);
grp('flame',flameM,flameC,flameHit);
// monokromator
const prism=mk(new THREE.CylinderGeometry(.28,.28,.6,3),M(0x7fd0ff,{transparent:true,opacity:.7,metalness:.1,roughness:.1}),.6,1.3,0);prism.rotation.x=Math.PI/2;
grp('mono',mk(new THREE.BoxGeometry(1.1,.9,.9),M(0x2d5d78,{transparent:true,opacity:.55}),.6,1.3,0),prism,mk(new THREE.BoxGeometry(.05,.4,.4),M(0xdde8ee,{metalness:1,roughness:.1}),.2,1.3,0));
// detektor
grp('det',cyl(.3,.7,M(0xd9a441,{metalness:.7}),1.9,1.3,0,'x'),mk(new THREE.BoxGeometry(.5,.5,.5),M(0x3a3f45),2.4,1.3,0));
// ducting
grp('duct',mk(new THREE.CylinderGeometry(.3,.85,.6,24,1,true),M(0xaeb7bc,{metalness:.8,side:THREE.DoubleSide}),-1.2,2.5,0),cyl(.2,1.5,M(0x9aa4aa,{metalness:.8}),-1.2,3.5,0));
// tabung gas
const gasS=(key,col,x,z,h)=>grp(key,cyl(.33,h,M(col,{metalness:.35}),x,h/2,z),mk(new THREE.SphereGeometry(.33,20,10,0,Math.PI*2,0,Math.PI/2),M(col,{metalness:.35}),x,h,z),cyl(.08,.2,M(0xc8a24a,{metalness:.8}),x,h+.3,z));
gasS('acet',0xd13b2f,3.7,-.9,2.1);gasS('air',0x2f78c9,4.5,-.4,1.9);
S.add(tube([[3.7,2.4,-.9],[3.2,.8,-1.4],[-.6,.3,-1],[-1.2,.7,-.05]],0xd13b2f));
S.add(tube([[4.5,2.1,-.4],[4,.4,-1.2],[-.4,.25,-.8],[-1.2,.55,.1]],0x2f78c9));
// botol sampel & drain
grp('sample',cyl(.26,.7,M(0xbfe3f2,{transparent:true,opacity:.5}),-1.7,.35,1.7),cyl(.22,.4,M(0xffd27a,{transparent:true,opacity:.8}),-1.7,.22,1.7),tube([[-1.7,.7,1.7],[-1.7,.7,1],[-1.2,.45,.4]],0x3b7fa0,.02));
grp('drain',cyl(.3,.6,M(0x8da0a8,{transparent:true,opacity:.6}),-2.7,.3,1.7),tube([[-1.2,.25,0],[-1.5,.1,1],[-2.7,.62,1.7]],0x555e64,.03));
// PC
const pcG=grp('pc',mk(new THREE.BoxGeometry(1.3,.85,.08),M(0x10161a),0,0,0),mk(new THREE.PlaneGeometry(1.15,.7),new THREE.MeshBasicMaterial({color:0x2a8fb0}),0,0,.05),cyl(.05,.4,M(0x333),0,-.6,0),mk(new THREE.BoxGeometry(.6,.05,.4),M(0x333),0,-.82,0));
pcG.position.set(-5.2,1.2,.8);pcG.rotation.y=.55;
// kurva di layar
const gc=document.createElement('canvas');gc.width=256;gc.height=160;const g2=gc.getContext('2d');g2.fillStyle='#0d3342';g2.fillRect(0,0,256,160);g2.strokeStyle='#ffb347';g2.lineWidth=3;g2.beginPath();g2.moveTo(20,130);g2.lineTo(230,30);g2.stroke();g2.fillStyle='#e8f1f2';g2.font='14px sans-serif';g2.fillText('A = 0,0128 C + 0,0054',20,20);
pcG.children[1].material=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(gc)});

// ---------- EXPLODED VIEW ----------
const OFF={lamp:[-1.7,0,0],burner:[0,.6,0],flame:[0,1.5,0],duct:[0,1.4,0],nebulizer:[0,-.05,.9],mono:[.2,.9,-1.1],det:[1.8,0,0],sample:[0,0,1.2],drain:[-1.1,0,1],pc:[-1.4,0,.4],acet:[1.2,0,-.9],air:[1.5,0,-.2]};
pick.forEach(g=>{g.userData.b=g.position.clone();g.userData.off=new THREE.Vector3(...OFF[g.userData.key])});
let ex=0,exT=0,caseOn=true;

// berkas cahaya
const beamA=cyl(.05,1.8,new THREE.MeshBasicMaterial({color:0xffc15a,transparent:true,opacity:.8}),-2.1,1.3,0,'x');
const beamB=cyl(.05,3.5,new THREE.MeshBasicMaterial({color:0xffc15a,transparent:true,opacity:.8}),.55,1.3,0,'x');
beamA.scale.set(1,1,1);const beam=new THREE.Group();beam.add(beamA,beamB);S.add(beam);
beamA.position.x=-2.1;beamA.scale.y=1;beamA.geometry.translate(0,0,0);
beamA.scale.y=1;beamB.position.x=.55;
const dots=[];for(let i=0;i<14;i++){const d=mk(new THREE.SphereGeometry(.05,8,8),new THREE.MeshBasicMaterial({color:0xfff2c8}));d.userData.p=i/14;beam.add(d);dots.push(d)}
// partikel nyala & atom Ca
function pts(n,col,sz){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:col,size:sz,transparent:true,opacity:.9,depthWrite:false}));S.add(p);return p}
const NF=120,NC=80,fp=pts(NF,0xffb060,.05),cp=pts(NC,0x58f0ff,.07);
const fv=[...Array(NF)].map(()=>({x:Math.random(),y:Math.random(),z:Math.random(),s:.3+Math.random()}));
const cv2=[...Array(NC)].map(()=>({a:Math.random()*6.28,r:Math.random()*.2,y:Math.random(),s:.2+Math.random()*.3}));

// ---------- UI ----------
const P=document.getElementById('panel'),tip=document.getElementById('tip');
let sel=null,goal=null;
function setHL(key){pick.forEach(g=>g.traverse(m=>{if(m.material&&m.material.emissive&&!m.userData.keepE){m.material.emissive.setHex(g.userData.key===key?0x2a5a6a:(m.userData.e0||0))}}))}
pick.forEach(g=>g.traverse(m=>{if(m.material&&m.material.emissive)m.userData.e0=m.material.emissive.getHex()}));
const STD=[[0,.008],[1,.014],[2,.032],[3,.044],[4,.057]];
const REG=(()=>{const n=STD.length,mx=STD.reduce((q,p)=>q+p[0],0)/n,my=STD.reduce((q,p)=>q+p[1],0)/n;let sxy=0,sxx=0,syy=0;STD.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2});const b=sxy/sxx;return{b,a:my-b*mx,r:sxy/Math.sqrt(sxx*syy)}})();
let tab='k',cx0=2;
const $=id=>document.getElementById(id);
const tabs=()=>`<div class="row tabs"><button data-t="k" class="${tab=='k'?'on':''}">Komponen</button><button data-t="c" class="${tab=='c'?'on':''}">Kurva kalibrasi</button></div>`;
const chips=()=>`<div class="row">${SC.map((x,i)=>`<button data-s="${i}" class="${i==cur?'on':''}">${x.l}</button>`).join('')}</div>`;
function sim(){const s=SC[cur],rel=s.a/BASE,pct=(s.a-BASE)/BASE*100,w=Math.max(0,Math.min(100,s.a/.038*100));
 return `<h3>Simulasi gangguan (data praktikum)</h3>${chips()}
 <h2 style="font-size:15px;margin-top:10px">${s.t}</h2><div class="eq">${s.e}</div><p>${s.x}</p>
 <div class="kv"><span>Absorbansi</span><b>${s.a.toFixed(3)}</b></div>
 <div class="bar"><i style="width:${w}%;background:${rel<.5?'var(--bad)':rel<.95?'var(--ac)':'var(--ok)'}"></i></div>
 <div class="kv"><span>Konsentrasi terbaca (Ca 2 mg/L)</span><b>${s.c.toFixed(2)} mg/L</b></div>
 <div class="kv"><span>Perubahan vs Ca saja</span><b class="${pct<0?'neg':'pos'}">${pct>0?'+':''}${pct.toFixed(1)}%</b></div>
 <p style="color:var(--mu);font-size:12px;margin-top:8px">Perhatikan nyala: jumlah titik biru (atom Ca⁰) dan terang berkas di detektor mengikuti absorbansi.</p>`}
const homeHTML=()=>`<h2>Mulai dari sini</h2><p>Sentuh bagian alat di model 3D, atau pilih dari daftar. Tekan "Bongkar komponen" untuk melihat tiap bagian terpisah.</p><h3>Bagian alat</h3><div class="row">${Object.keys(INFO).map(k=>`<button data-k="${k}">${INFO[k].n.split(' (')[0].split(' &')[0]}</button>`).join('')}</div>${sim()}`;
const partHTML=k=>{const i=INFO[k];return `<button data-b>← Semua bagian</button><h2 style="margin-top:10px">${i.n}</h2><h3>Fungsi</h3><p>${i.d}</p><h3>Kaitan dengan gangguan Ca</h3><p>${i.c}</p>${sim()}`};
function curveHTML(){const s=SC[cur],xr=(s.a-REG.a)/REG.b;
 return `<h2>Kurva kalibrasi Ca</h2><p>Klik atau geser pada grafik untuk membaca absorbansi dari konsentrasi. Pilih larutan uji untuk melihat konsentrasi yang terbaca dibanding nilai sebenarnya (2,00 mg/L).</p>
 <canvas id="cal" width="640" height="460" aria-label="Kurva kalibrasi kalsium"></canvas>
 <input id="cs" type="range" min="0" max="4" step="0.05" value="${cx0}" aria-label="Konsentrasi Ca">
 <div class="kv"><span>Konsentrasi Ca (x)</span><b id="rx"></b></div><div class="kv"><span>Absorbansi (y = a + bx)</span><b id="ry"></b></div>
 <h3>Persamaan regresi (dihitung dari 5 titik standar)</h3><div class="eq">y = ${REG.b.toFixed(4)}x + ${REG.a.toFixed(4)}<br>r = ${REG.r.toFixed(4)}  (kriteria ideal ≥ 0,9950)</div>
 <h3>Larutan uji</h3>${chips()}<h2 style="font-size:15px;margin-top:10px">${s.t}</h2>
 <div class="kv"><span>Absorbansi</span><b>${s.a.toFixed(3)}</b></div>
 <div class="kv"><span>x = (A − a) / b</span><b class="${xr<2?'neg':'pos'}">${xr.toFixed(4)} mg/L</b></div>
 <div class="kv"><span>Nilai sebenarnya</span><b>2,00 mg/L</b></div>
 <p style="color:var(--mu);font-size:12px">Nilai negatif berarti absorbansi lebih kecil dari intersep: Ca hampir tidak terdeteksi karena atomisasi gagal.</p>`}
function drawCal(){const c=$('cal');if(!c)return;const g=c.getContext('2d'),W=c.width,H=c.height,L=76,Rm=24,T=24,B=64,X0=-.6,X1=4.4,Y0=-.005,Y1=.065;
 const px=x=>L+(x-X0)/(X1-X0)*(W-L-Rm),py=y=>H-B-(y-Y0)/(Y1-Y0)*(H-T-B);
 const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
 g.clearRect(0,0,W,H);g.font='20px sans-serif';g.lineWidth=1;
 g.fillStyle=v('--mu');g.strokeStyle=v('--ln');
 for(let x=0;x<=4;x++){g.beginPath();g.moveTo(px(x),T);g.lineTo(px(x),H-B);g.stroke();g.textAlign='center';g.fillText(x,px(x),H-B+26)}
 for(let k=0;k<=6;k++){const y=k/100;g.beginPath();g.moveTo(L,py(y));g.lineTo(W-Rm,py(y));g.stroke();g.textAlign='right';g.fillText(y.toFixed(2),L-8,py(y)+7)}
 g.textAlign='center';g.fillText('Konsentrasi Ca (mg/L)',(L+W-Rm)/2,H-12);
 g.save();g.translate(20,(T+H-B)/2);g.rotate(-Math.PI/2);g.fillText('Absorbansi',0,0);g.restore();
 g.strokeStyle=v('--mu');g.lineWidth=2;g.beginPath();g.moveTo(px(0),T);g.lineTo(px(0),H-B);g.moveTo(L,py(0));g.lineTo(W-Rm,py(0));g.stroke();
 const ln=x=>REG.a+REG.b*x;
 g.strokeStyle=v('--ac');g.lineWidth=3;g.beginPath();g.moveTo(px(X0),py(ln(X0)));g.lineTo(px(X1),py(ln(X1)));g.stroke();
 g.fillStyle=v('--tx');STD.forEach(([x,y])=>{g.beginPath();g.arc(px(x),py(y),7,0,6.3);g.fill()});
 const s=SC[cur],xr=(s.a-REG.a)/REG.b,col=xr<1?v('--bad'):v('--ok');
 g.setLineDash([8,6]);g.lineWidth=2;g.strokeStyle=col;g.beginPath();g.moveTo(L,py(s.a));g.lineTo(px(xr),py(s.a));g.lineTo(px(xr),py(0));g.stroke();
 g.strokeStyle=v('--mu');g.beginPath();g.moveTo(px(2),py(0));g.lineTo(px(2),py(ln(2)));g.stroke();g.setLineDash([]);
 g.fillStyle=col;g.beginPath();g.arc(px(xr),py(s.a),9,0,6.3);g.fill();
 g.strokeStyle=v('--mu');g.lineWidth=2;g.beginPath();g.arc(px(2),py(ln(2)),9,0,6.3);g.stroke();
 g.fillStyle=col;g.textAlign=xr>3?'right':'left';g.fillText(s.l+': '+xr.toFixed(2),px(xr)+(xr>3?-14:14),py(s.a)-12);
 g.fillStyle=v('--mu');g.textAlign='left';g.fillText('2,00 (sebenarnya)',px(2)+12,py(ln(2))+26);
 const y=ln(cx0);g.fillStyle=v('--ac');g.strokeStyle=v('--bg');g.lineWidth=3;g.beginPath();g.arc(px(cx0),py(y),10,0,6.3);g.fill();g.stroke();
 $('rx').textContent=cx0.toFixed(2)+' mg/L';$('ry').textContent=y.toFixed(4)}
function initCurve(){const c=$('cal'),sl=$('cs');
 const setX=x=>{cx0=Math.max(0,Math.min(4,x));sl.value=cx0;drawCal()};
 sl.oninput=()=>setX(+sl.value);
 const fromEv=e=>{const r=c.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*c.width;setX(-.6+(X-76)/(c.width-76-24)*5)};
 let d=false;c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);fromEv(e)};c.onpointermove=e=>{if(d)fromEv(e)};c.onpointerup=()=>d=false;
 drawCal()}
function render(){P.innerHTML=tabs()+(tab=='c'?curveHTML():sel?partHTML(sel):homeHTML());
 P.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 P.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>choose(b.dataset.k));
 P.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;render()});
 const bk=P.querySelector('[data-b]');if(bk)bk.onclick=home;if(tab=='c')initCurve()}
function home(){sel=null;tab='k';setHL(null);goal={t:new THREE.Vector3(-.5,1.2,0),p:new THREE.Vector3(5.5,3.6,8)};render()}
function choose(k){sel=k;tab='k';setHL(k);const f=INFO[k].f,t=new THREE.Vector3(f[0],f[1],f[2]).add(new THREE.Vector3(...OFF[k]).multiplyScalar(exT));
 goal={t,p:t.clone().add(new THREE.Vector3(.6,.5,1).normalize().multiplyScalar(f[3]))};render()}
home();
O.addEventListener('start',()=>goal=null);
$('bBeam').onclick=e=>{showBeam=!showBeam;e.target.classList.toggle('on',showBeam)};
$('bCase').onclick=e=>{caseOn=e.target.classList.toggle('on')};
$('bExp').onclick=e=>{exT=exT>.5?0:1;$('ex').value=exT;e.target.classList.toggle('on',exT>.5)};
$('ex').oninput=e=>{exT=+e.target.value;$('bExp').classList.toggle('on',exT>.5)};
$('bSpin').onclick=e=>{O.autoRotate=e.target.classList.toggle('on');O.autoRotateSpeed=1.2};
$('bIn').onclick=()=>zoom(.78);$('bOut').onclick=()=>zoom(1.3);$('bReset').onclick=home;
function zoom(f){goal=null;const v=C.position.clone().sub(O.target).multiplyScalar(f);C.position.copy(O.target.clone().add(v))}

// interaksi
const RC=new THREE.Raycaster(),mv=new THREE.Vector2();let dn=null;
function hit(e){const r=R.domElement.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);RC.setFromCamera(mv,C);
 const h=RC.intersectObjects(pick,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.key)o=o.parent;return o?o.userData.key:null}
R.domElement.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(dn&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])<6){const k=hit(e);if(k)choose(k)}dn=null});
R.domElement.addEventListener('pointermove',e=>{const k=hit(e);R.domElement.style.cursor=k?'pointer':'grab';
 if(k){tip.style.display='block';tip.textContent=INFO[k].n;tip.style.left=Math.min(e.clientX+12,innerWidth-200)+'px';tip.style.top=(e.clientY+12)+'px'}else tip.style.display='none'});
function rs(){const w=app.clientWidth,h=app.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

// animasi
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let t0=0;
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-t0)/1000,.05);t0=t;
 if(goal){C.position.lerp(goal.p,.07);O.target.lerp(goal.t,.07);if(C.position.distanceTo(goal.p)<.02)goal=null}
 O.update();
 ex+=(exT-ex)*(calm?1:.08);
 pick.forEach(g=>g.position.copy(g.userData.b).addScaledVector(g.userData.off,ex));
 caseMat.opacity=(caseOn?.16:.92)*(1-.9*ex);lg.visible=ex<.4;edges.visible=ex<.6;
 const fo=OFF.flame[1]*ex;
 const s=SC[cur],rel=Math.min(s.a/.038,1);
 beam.visible=showBeam&&ex<.15;
 beamB.material.opacity=.15+.65*(1-rel*.8);
 dots.forEach(d=>{d.userData.p=(d.userData.p+dt*.35*(calm?0:1))%1;const x=-3.3+d.userData.p*6;d.position.set(x,1.3,0);d.scale.setScalar(x>-1.2?Math.max(.3,1-rel*.6):1)});
 const fa=fp.geometry.attributes.position;
 fv.forEach((p,i)=>{p.y+=dt*p.s*(calm?0:1);if(p.y>1)p.y=0;const h=p.y,r=.17*(1-h)+.02;fa.setXYZ(i,-1.2+(p.x-.5)*2*r,1.15+h*.55+fo,(p.z-.5)*2*r)});fa.needsUpdate=true;
 flameM.scale.y=1+Math.sin(t*.012)*.06;fl.position.y=1.4+fo;fl.intensity=.8+rel*.8+Math.sin(t*.02)*.1;
 const ca=cp.geometry.attributes.position,n=Math.round(NC*rel*(s.a<.005?.15:1));
 cv2.forEach((p,i)=>{p.a+=dt*p.s*3;p.y=(p.y+dt*.15*p.s)%1;ca.setXYZ(i,-1.2+Math.cos(p.a)*p.r*(1-p.y*.6),1.15+p.y*.5+fo,Math.sin(p.a)*p.r*(1-p.y*.6))});ca.needsUpdate=true;cp.geometry.setDrawRange(0,n);
 R.render(S,C)})(0);
</script>
</body>
</html>
